version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Keep Node types aligned with the Node 24 runtime used in CI.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
        update-types: [minor, patch]
      development:
        dependency-type: development
        exclude-patterns:
          - '@types/react'
          - '@types/react-dom'
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
